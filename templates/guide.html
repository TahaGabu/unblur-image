<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
</head>
<body>
  {% include "_atmosphere.html" %}
  <header class="nav">
    <a class="brand" href="/"><span class="mark"></span>Unblur</a>
    <a class="btn btn-small magnetic" href="/#studio"><span>Unblur a photo</span></a>
  </header>
  <article class="sheet">
    <p class="eyebrow"><a href="/guides">Guides</a></p>
    <h1>{{ guide.h1 }}</h1>
    <p class="lede">{{ guide.lede }}</p>
    {% for heading, lines in guide.sections %}
    <section>
      <h2>{{ heading }}</h2>
      {% for line in lines %}<p>{{ line }}</p>{% endfor %}
    </section>
    {% endfor %}
    <p><a class="btn" href="/#studio">Unblur your photo</a></p>
  </article>
  {% include "_footer.html" %}
</body>
</html>
